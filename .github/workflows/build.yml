name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and setup project
        run: |
          ZIP_FILE=$(find. -maxdepth 2 -name "*.zip" | head -n 1)
          rm -rf temp_unzip && mkdir temp_unzip
          unzip -o "$ZIP_FILE" -d temp_unzip
          PKG_DIR=$(find temp_unzip -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cp -R $PKG_DIR/..
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix SDK
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.nonFinalResIds=false" >> android/gradle.properties
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/8.7.0/8.9.1/g' android/build.gradle.kts || true
      - run: flutter pub get
      - run: flutter build appbundle --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
