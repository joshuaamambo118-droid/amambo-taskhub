workflows:
  android-build:
    name: Android AAB Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Unzip project
        script: |
          set -x
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "ZIP=$ZIP_FILE"
          rm -rf temp_unzip
          mkdir temp_unzip
          unzip -o "$ZIP_FILE" -d temp_unzip
          PKG_DIR=$(find temp_unzip -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PKG_DIR=$PKG_DIR"
          cp -R "$PKG_DIR"/. .
          ls -la
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/*.aab
