workflows:
  android-build:
    name: Android AAB Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Unzip project
        script: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          rm -rf temp_unzip && mkdir temp_unzip
          unzip -o "$ZIP_FILE" -d temp_unzip
          PKG_DIR=$(find temp_unzip -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cp -R "$PKG_DIR"/. .
      - name: Fix Gradle version and AGP
        script: |
          # Upgrade Gradle to 8.14.0 - this is what Flutter requires
          sed -i '' 's/8.10.2/8.14.0/g' android/gradle/wrapper/gradle-wrapper.properties
          # Fix AGP 9 error
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.nonFinalResIds=false" >> android/gradle.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle.properties
      - name: Get dependencies
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/bundle/release/*.aab
