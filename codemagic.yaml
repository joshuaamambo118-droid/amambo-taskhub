workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - keystore_credentials
    scripts:
      - name: Unzip project
        script: |
          echo "Unzipping project..."
          unzip -o ph_task_hub-copy.zip -d .
          # Move files from subfolder to root
          if [ -d "ph_task_hub-copy" ]; then
            cp -r ph_task_hub-copy/* . 2>/dev/null || true
            cp -r ph_task_hub-copy/.* . 2>/dev/null || true
            rm -rf ph_task_hub-copy
          fi
          rm -f ph_task_hub-copy.zip
          ls -la
          cat pubspec.yaml
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "storeFile=/tmp/keystore.jks" > android/key.properties
          echo "storePassword=$CM_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - joshuaamambo118@gmail.com
